<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404: Page Not Found | Hardik Bhaskar</title>
    <meta name="description" content="This page does not exist. Return to Hardik Bhaskar's portfolio." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#05050A" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        background: #05050A;
        color: #F0F0F8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .page-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .nav-header {
        padding: 2rem 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        color: #F0F0F8;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.125rem;
        letter-spacing: -0.01em;
      }
      .home-link {
        color: #00E5FF;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        transition: opacity 0.2s ease;
      }
      .home-link:hover {
        opacity: 0.8;
      }
      .main-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        text-align: center;
      }
      .content-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        max-width: 480px;
      }
      .error-code {
        font-size: clamp(80px, 16vw, 160px);
        font-weight: 900;
        line-height: 1;
        margin: 0;
        color: #F0F0F8;
        letter-spacing: -0.05em;
        font-variant-numeric: tabular-nums;
      }
      .error-accent {
        color: #00E5FF;
      }
      .error-title {
        font-size: 1.75rem;
        font-weight: 700;
        margin: 0;
        color: #F0F0F8;
        letter-spacing: -0.02em;
      }
      .error-desc {
        font-size: 1rem;
        line-height: 1.6;
        color: #8888A8;
        margin: 0;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #F0F0F8;
        color: #05050A;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        text-decoration: none;
        margin-top: 0.75rem;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
      .btn-primary:hover {
        background: #FFFFFF;
        transform: translateY(-1px);
      }
      .btn-primary:focus-visible {
        outline: 2px solid #00E5FF;
        outline-offset: 2px;
      }
      .page-footer {
        padding: 2rem 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        text-align: center;
        color: #52526A;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <header class="nav-header">
        <a href="/" class="logo">Hardik Bhaskar</a>
        <a href="/" class="home-link">&larr; Return Home</a>
      </header>
      <main class="main-content">
        <div class="content-card">
          <p class="error-code"><span class="error-accent">4</span>0<span class="error-accent">4</span></p>
          <h1 class="error-title">Page not found</h1>
          <p class="error-desc">
            The requested resource does not exist or has been moved to another location.
          </p>
          <a href="/" class="btn-primary">
            &larr; Back to home
          </a>
        </div>
      </main>
      <footer class="page-footer">
        Hardik Bhaskar &copy; 2026. All rights reserved.
      </footer>
    </div>
  </body>
</html>
