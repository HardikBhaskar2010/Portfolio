name: Sync Projects

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 6 am UTC
  workflow_dispatch: {}    # manual trigger — run this right after tagging a new repo

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to git-push the updated JSON

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate projects.generated.json
        run: npm run projects:sync
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet src/data/projects.generated.json || \
            (git add src/data/projects.generated.json && \
             git commit -m "chore: sync projects from GitHub [skip ci]" && \
             git push)
