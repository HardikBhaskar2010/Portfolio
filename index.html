    <!-- ═══════════════════════════════════════════════════════
         CRITICAL INLINE CSS — prevents FOUC
    ═══════════════════════════════════════════════════════ -->
    <style>
      /* Prevent flash of white */
      html, body { background: #05050A; margin: 0; }

      /* Loading state */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #05050A;
        z-index: 99999;
      }

      /* Branded scrollbar (visible before CSS loads) */
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: #05050A; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #00E5FF, #7C3AED);
        border-radius: 2px;
      }
