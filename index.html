<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />

    <!-- ─── Primary Favicon ─────────────────────────────────── -->
    <link rel="icon"             type="image/png" sizes="32x32"  href="/images/logo.png" />
    <link rel="icon"             type="image/png" sizes="16x16"  href="/images/logo.png" />
    <link rel="shortcut icon"    type="image/png"                 href="/images/logo.png" />

    <!-- ─── Apple / PWA Icons ───────────────────────────────── -->
    <link rel="apple-touch-icon" sizes="180x180"                  href="/images/logo.png" />
    <meta name="apple-mobile-web-app-capable"        content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"          content="Hardik Bhaskar" />

    <!-- ─── SEO ─────────────────────────────────────────────── -->
    <title>Hardik Bhaskar — Full Stack Developer & AI Systems Builder</title>
    <meta name="description"
      content="I build cinematic web experiences, AI-powered systems, and futuristic interactive products. Specialising in React, TypeScript, Three.js, Framer Motion, and AI." />
    <meta name="keywords"
      content="Hardik Bhaskar, Luna Kitsune, Frontend Developer, React Developer, AI Systems, Three.js, Portfolio" />
    <meta name="author" content="Hardik Bhaskar" />
    <meta name="robots" content="index, follow" />

    <!-- ─── Open Graph ───────────────────────────────────────── -->
    <meta property="og:site_name"   content="Hardik Bhaskar Portfolio" />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Hardik Bhaskar — Luna Kitsune" />
    <meta property="og:description" content="Cinematic web experiences, AI systems, and futuristic digital products." />
    <meta property="og:image"       content="/images/avatar.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ─── Twitter Card ─────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@kitsune_luna05" />
    <meta name="twitter:creator"     content="@kitsune_luna05" />
    <meta name="twitter:title"       content="Hardik Bhaskar — Luna Kitsune" />
    <meta name="twitter:description" content="Cinematic web experiences, AI systems & futuristic digital products." />
    <meta name="twitter:image"       content="/images/avatar.png" />

    <!-- ─── Preconnect for Google Fonts ─────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ─── Google Fonts ─────────────────────────────────────── -->
    <!-- Instrument Serif · Syne · Inter · Space Grotesk · JetBrains Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- ─── Inline Logo SVG fallback in tab title area ───────── -->
    <!--
      The <link rel="icon"> above handles browser tabs.
      The SVG below is embedded as an inline data URI alternative
      so even if /images/logo.png hasn't loaded yet there's a placeholder.
    -->
    <style>
      /* Prevent flash of unstyled content */
      html { background: #080808; }

      /* Branded scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #080808; }
      ::-webkit-scrollbar-thumb { background: #1C1C1C; border-radius: 2px; }
    </style>
  </head>

  <body>
    <!--
      ┌──────────────────────────────────────────────┐
      │  Hardik Bhaskar · Luna Kitsune               │
      │  Full Stack Developer & AI Systems Builder   │
      │  Portfolio — built with React + Vite + TS   │
      │  github.com/HardikBhaskar2010                │
      └──────────────────────────────────────────────┘
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
